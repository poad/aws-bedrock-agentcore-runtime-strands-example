packages:
  - .
  - agent
  - cdk
  - deploy-role
  - frontend

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.20.0
  - '@aws-sdk/credential-provider-http@3.972.83'
  - '@aws-sdk/credential-provider-ini@3.973.26'
  - '@aws-sdk/credential-provider-sso@3.973.25'
  - '@aws-sdk/nested-clients@3.998.0'

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  tinypool@<2.1.2: ^2.1.2

trustPolicy: no-downgrade

injectWorkspacePackages: true
