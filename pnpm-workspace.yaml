packages:
  - .
  - ./agent
  - ./cdk
  - ./deploy-role
  - ./frontend

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@11.20.0
  - '@hono/node-server@2.0.5'
  - fast-uri@3.1.4 || 3.1.5 || 4.1.1 || 4.1.2
  - fast-xml-parser@5.10.1
  - find-my-way@9.6.1 || 9.7.0
  - brace-expansion@5.0.8 || 5.0.9
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34

overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  brace-expansion@<=5.0.7: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  chokidar: '>=5'
  eslint-import-resolver-typescript: '^4.4.5'
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  fast-uri@>=4.0.0 <4.1.2: ^4.1.2
  fast-uri@>=4.0.0 <=4.1.0: ^4.1.1
  fast-xml-parser@>=5.9.3 <5.10.1: ^5.10.1
  find-my-way@<=9.6.0: ^9.6.1
  graphql: ^17.0.2
  handlebars@>=4.0.0 <4.7.9: ^4.7.9
  handlebars@>=4.0.0 <=4.7.8: ^4.7.9
  handlebars@>=4.6.0 <=4.7.8: ^4.7.9
  hono@<4.12.34: ^4.12.34
  immutable@<3.8.3: ^3.8.3
  immutable@<4.3.9: ^4.3.9
  ip-address@<=10.3.0: ^10.3.1
  ip-address@>=10.1.1 <=10.2.0: ^10.2.1
  ip-address@>=10.1.1 <=10.2.1: ^10.2.2
  lodash@<=4.17.23: ^4.17.24
  lodash@>=4.0.0 <=4.17.23: ^4.17.24
  semver: '>=7'
  ua-parser-js: ^2.0.10

trustPolicy: no-downgrade

injectWorkspacePackages: true
